name: Simalytics – market data fetch

on:
  schedule:
    # Každých 15 minut. Pozn.: GitHub cron může mít pár minut zpoždění.
    - cron: "*/15 * * * *"
  workflow_dispatch: # umožňuje ruční spuštění z GitHub UI (testování)

concurrency:
  group: market-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch market data → Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SIMCOMPANIES_ITEMS: ${{ vars.SIMCOMPANIES_ITEMS }}
          SIMCOMPANIES_QUALITIES: ${{ vars.SIMCOMPANIES_QUALITIES || '0' }}
        run: npm run fetch:market
